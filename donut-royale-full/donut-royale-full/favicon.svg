<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Donut Royale logo</title>
  <!-- Original hand-authored vector emblem: royal ring + ribbon -->
  <defs>
    <linearGradient id="midnight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#143C40"/>
      <stop offset="1" stop-color="#091622"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF2B9"/>
      <stop offset=".55" stop-color="#EFC37D"/>
      <stop offset="1" stop-color="#C38B4E"/>
    </linearGradient>
    <linearGradient id="berry" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F46D78"/>
      <stop offset=".55" stop-color="#CA3D59"/>
      <stop offset="1" stop-color="#922B45"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#midnight)" stroke="#71988A" stroke-width="1.5"/>
  <!-- Three-peak royal insignia, built from straight geometric segments -->
  <path d="M22 20 20 11 28 15 32 7 36 15 44 11 42 20Z" fill="url(#gold)" stroke="#7B5133" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M22 19.5H42" stroke="#FFE4A0" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 13 34.8 16 32 18.8 29.2 16Z" fill="#A9304D"/>
  <!-- The ring is a proprietary drawn letterform, not a stock donut image -->
  <g transform="rotate(-10 32 37)">
    <circle cx="32" cy="37" r="18" fill="url(#gold)" stroke="#7B4C39" stroke-width="1.4"/>
    <path d="M14.5 36C14.5 25 23 18.8 32 18.8c10.8 0 17.5 6.9 17.5 16.3-3.6 1.1-4.7-1.5-7.1-1.5-3.3 0-3.7 4.3-7.5 4.3-3.4 0-3.7-4.4-6.9-4.4-4.3 0-5.8 4.8-9.1 2.4-2.7-2.1-3.6-1.9-5.5-2.3Z" fill="url(#berry)"/>
    <path d="M21 29.5 23.8 27.8M37.4 26.9 40.2 28.7" stroke="#FFE9C6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="37" r="7.4" fill="#092630" stroke="#F4D59D" stroke-width="2.1"/>
    <path d="M19.5 39c.5 4 3.8 8 7.9 10" stroke="#FFF4C9" stroke-width="1.7" stroke-linecap="round" fill="none" opacity=".75"/>
  </g>
  <!-- Short diagonal ribbon makes the circular emblem read like a custom R -->
  <path d="M41 47 49 55" stroke="#15212C" stroke-width="9" stroke-linecap="round"/>
  <path d="M41 47 49 55" stroke="url(#berry)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="48.4" cy="54.6" r="2.2" fill="#F3D393"/>
</svg>
